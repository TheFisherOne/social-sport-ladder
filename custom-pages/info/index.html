<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Introduction</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    #backBtn { flex: 0 0 auto; margin: 4px; padding: 8px 16px; align-self: flex-start; }
    iframe { flex: 1 1 auto; width: 100%; border: none; min-height: 0; }
  </style>
</head>
<body>

  <button id="backBtn">Go Back</button>

  <iframe id="content" src="SocialSportLadder.html" title="About Social Sport Ladder"></iframe>

  <script>
    // history.length never shrinks, so track how deep the iframe has navigated.
    // Go Back steps back inside the iframe first, then leaves the page.
    const startLength = history.length;
    const stack = [];
    document.getElementById('content').addEventListener('load', function () {
      let href;
      try { href = this.contentWindow.location.href; } catch (e) { return; }
      if (stack.length > 1 && stack[stack.length - 2] === href) stack.pop();
      else if (stack[stack.length - 1] !== href) stack.push(href);
    });
    document.getElementById('backBtn').addEventListener('click', function () {
      if (stack.length > 1) history.back();
      else if (startLength > 1) history.back();
      else {
        // Scripts can't close a tab they didn't open, so on Android hand control back to the app.
        window.close();
        if (/Android/i.test(navigator.userAgent)) {
          window.location.href = 'socialsportladder://open';
        }
      }
    });
  </script>

</body>
</html>
