<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Introduction</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    #backBtn { flex: 0 0 auto; margin: 4px; padding: 8px 16px; align-self: flex-start; }
    iframe { flex: 1 1 auto; width: 100%; border: none; min-height: 0; }
  </style>
  <script>
    window.onload = function() {
      if (window.history.length <= 1) {
        document.getElementById('backBtn').style.display = 'none';
      }
    };
  </script>
</head>
<body>

  <button id="backBtn" onclick="history.back()">Go Back</button>

  <iframe src="SocialSportLadder.html" title="About Social Sport Ladder"></iframe>

</body>
</html>
